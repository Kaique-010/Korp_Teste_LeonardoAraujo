<mat-toolbar color="primary" class="barra">
  <div class="barra-inner">
    <button mat-icon-button routerLink="/" matTooltip="Página inicial" aria-label="Ir para home">
      <mat-icon>home</mat-icon>
    </button>

    <span class="titulo" routerLink="/" tabindex="0" role="link" aria-label="Voltar para home">Korp — Notas Fiscais</span>

    @if (!mobile()) {
      <nav class="navegacao" aria-label="Navegação principal">
        @for (item of itens; track item.rota) {
          <a
            mat-button
            [routerLink]="item.rota"
            routerLinkActive="ativo"
            [routerLinkActiveOptions]="item.exact ? { exact: true } : {}"
            [matTooltip]="item.rotulo"
          >
            <mat-icon>{{ item.icone }}</mat-icon>
            {{ item.rotulo }}
          </a>
        }
      </nav>
      <div class="spacer"></div>
    } @else {
      <div class="spacer"></div>
      <button
        mat-icon-button
        [matMenuTriggerFor]="menuPrincipal"
        matTooltip="Abrir menu"
        aria-label="Abrir menu principal"
      >
        <mat-icon>menu</mat-icon>
      </button>
      <mat-menu #menuPrincipal="matMenu" xPosition="before">
        @for (item of itens; track item.rota) {
          <a
            mat-menu-item
            [routerLink]="item.rota"
            routerLinkActive="ativo"
            [routerLinkActiveOptions]="item.exact ? { exact: true } : {}"
          >
            <mat-icon>{{ item.icone }}</mat-icon>
            <span>{{ item.rotulo }}</span>
          </a>
        }
        <mat-divider *ngIf="isLoggedIn()"></mat-divider>
        <a
          *ngIf="!isLoggedIn()"
          mat-menu-item
          routerLink="/login"
        >
          <mat-icon>login</mat-icon>
          <span>Login</span>
        </a>
        <button
          *ngIf="isLoggedIn()"
          mat-menu-item
          (click)="logout()"
        >
          <mat-icon>logout</mat-icon>
          <span>Sair</span>
        </button>
      </mat-menu>
    }

    <div class="header-acoes">
      <ng-container *ngIf="!mobile()">
        <ng-container *ngIf="isLoggedIn(); else loginBtn">
          <span class="usuario-nome" matTooltip="Usuário logado">{{ getUserName() }}</span>
          <button
            mat-icon-button
            matTooltip="Sair"
            aria-label="Fazer logout"
            (click)="logout()"
          >
            <mat-icon>logout</mat-icon>
          </button>
        </ng-container>
        <ng-template #loginBtn>
          <button
            mat-button
            routerLink="/login"
            matTooltip="Entrar com sua conta"
            aria-label="Ir para login"
          >
            <mat-icon>login</mat-icon>
            Login
          </button>
        </ng-template>
      </ng-container>
      <app-theme-toggle />
    </div>
  </div>
</mat-toolbar>
