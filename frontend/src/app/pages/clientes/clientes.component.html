<div class="cabecalho">
  <h2>Clientes</h2>
  <button mat-flat-button color="primary" (click)="abrirCriar()">
    <mat-icon>add</mat-icon>
    Novo cliente
  </button>
</div>

@if (carregando()) {
  <mat-progress-bar mode="indeterminate" />
}

@if (!carregando() && clientes().length === 0) {
  <p class="vazio">Nenhum cliente cadastrado. Clique em "Novo cliente" para começar.</p>
}

@if (clientes().length > 0) {
  <div class="tabela">
    <table mat-table [dataSource]="clientes()">
      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef>ID</th>
        <td mat-cell *matCellDef="let c">{{ c.id }}</td>
      </ng-container>

      <ng-container matColumnDef="nome">
        <th mat-header-cell *matHeaderCellDef>Nome</th>
        <td mat-cell *matCellDef="let c">{{ c.nome }}</td>
      </ng-container>

      <ng-container matColumnDef="criado_em">
        <th mat-header-cell *matHeaderCellDef>Cadastrado em</th>
        <td mat-cell *matCellDef="let c">{{ c.criado_em | date: 'dd/MM/yyyy HH:mm' }}</td>
      </ng-container>

      <ng-container matColumnDef="acoes">
        <th mat-header-cell *matHeaderCellDef>Ações</th>
        <td mat-cell *matCellDef="let c">
          <button mat-icon-button color="primary" (click)="abrirEditar(c)">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button color="warn" (click)="excluir(c)">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="colunas"></tr>
      <tr mat-row *matRowDef="let row; columns: colunas"></tr>
    </table>
  </div>
}
